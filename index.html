<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DailyFlow Pro v2</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<h1>🎤 DailyFlow Pro v2</h1>
<div class="cards">
<section class="card"><h2>اعضا</h2><textarea id="names" placeholder="علی\nمحمد\nسارا"></textarea><button onclick="draw()">🎲 قرعه کشی</button></section>
<section class="card"><h2 id="speaker">آماده</h2><div id="timer">00:00</div><p id="next"></p>
<button onclick="start()">▶ شروع</button><button onclick="pause()">⏸ توقف</button><button onclick="skip()">⏭ Skip</button><button onclick="finish()">⏹ پایان</button>
<ol id="list"></ol></section></div>
<section class="card"><h2>📊 گزارش</h2><div id="report"></div></section>
</main><script src="app.js"></script></body></html>
