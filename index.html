<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DailyFlow Pro v2 Final</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<h1>🎤 DailyFlow Pro</h1>
<div class="grid">
<div class="card">
<h2>اعضای تیم</h2>
<textarea id="names" placeholder="علی&#10;محمد&#10;سارا"></textarea>
<button id="draw">🎲 قرعه کشی</button>
</div>

<div class="card">
<h2 id="current">آماده</h2>
<div class="timer" id="timer">00:00</div>
<div class="next" id="next">نفر بعدی: -</div>
<div>
<button id="start">▶ شروع</button>
<button id="pause">⏸ توقف</button>
<button id="skip">⏭ Skip</button>
<button id="finish">⏹ پایان</button>
</div>
<ol id="list"></ol>
</div>
</div>

<div class="card">
<h2>📊 گزارش جلسه</h2>
<div id="report"></div>
</div>
</div>
<script src="app.js"></script>
</body>
</html>
